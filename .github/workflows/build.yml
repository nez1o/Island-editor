name: Build module

on:
  push:
    branches-ignore: [build-output]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Python
        run: |
          (command -v python3 && command -v python) || (apt-get update && apt-get install -y python3 python-is-python3)
      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash ./exlaunch.sh build
          ls -la deploy
      - uses: actions/upload-artifact@v4
        with:
          name: module-${{ github.sha }}
          path: deploy/
      - name: Publish build to the build-output branch
        run: |
          set -e
          mkdir -p /tmp/out && cp -r deploy/. /tmp/out/
          cd /tmp/out
          git init -q -b build-output
          git config user.name "build bot"
          git config user.email "actions@users.noreply.github.com"
          echo "Module built from ${GITHUB_REF_NAME} at ${GITHUB_SHA}" > BUILD.txt
          git add -f .
          git commit -q -m "Build of ${GITHUB_REF_NAME} ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "build-output:build-output-${GITHUB_REF_NAME//\//-}"
